<script>
const Q=m=>/row-level security/i.test(m)?'数据库权限没配好：重跑 SQL 策略':/relation .* does not exist/i.test(m)?'数据表不存在：先跑建表 SQL':/Failed to fetch|NetworkError|Load failed/i.test(m)?'连不上服务器（需要能访问外网）':m;

const api={
async signUp(u,p,invite){const code=(invite||'').trim(),ok=!!code&&CFG.INVITES.indexOf(code)>-1;
 const {data,error}=await sb.auth.signUp({email:emailOf(u),password:p,options:{data:{username:u}}});
 if(error)throw new Error(/already|registered|exists/i.test(error.message)?'这个用户名已经被用啦':error.message);
 if(!data.session)throw new Error('还需邮箱验证：去 Supabase 关掉 Confirm email');
 const r=await sb.from('profiles').upsert({id:data.user.id,username:u,status:ok?'approved':'pending',invite_code:code,created_at:new Date().toISOString()},{onConflict:'id'});
 if(r.error)throw new Error(Q(r.error.message));return data.user},

for(const dom of ['@class.local','@hd.local']){const r=await sb.auth.signInWithPassword({email:box+dom,password:p});if(!r.error)return r.data.user;err=r.error}
if(err&&/not confirmed/i.test(err.message))throw new Error('邮箱还没验证：去 Supabase → Authentication → Users 点一下确认');
throw new Error('用户名或密码不对哦')},

 try{const r=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();if(r&&r.data)p=r.data}catch(e){}
 return{id:u.id,username:p.username||(u.user_metadata&&u.user_metadata.username)||'同学',avatar:p.avatar_url||'',role:p.role||'member',status:p.status||'approved',muted_until:p.muted_until||null,created_at:p.created_at||u.created_at}},

 return(data||[]).map(c=>({...c,id:String(c.id),post_id:String(c.post_id)}))},
async addComment(c){const{error}=await sb.from('comments').insert({post_id:c.post_id,author_id:c.author_id,author_name:c.author_name,body:c.body});if(error)throw new Error(Q(error.message))},
async deleteComment(id){const{error}=await sb.from('comments').delete().eq('id',id);if(error)throw new Error(Q(error.message))},
async listUsers(){const{data,error}=await sb.from('profiles').select('*').order('created_at',{ascending:false});if(error)throw new Error(Q(error.message));
 return(data||[]).map(p=>({id:p.id,username:p.username,avatar:p.avatar_url||'',status:p.status||'approved',created_at:p.created_at,muted_until:p.muted_until||null,invite_code:p.invite_code||''}))},
async countPending(){const r=await sb.from('profiles').select('id',{count:'exact',head:true}).eq('status','pending');return r.count||0},
async setStatus(id,st){const{error}=await sb.from('profiles').update({status:st}).eq('id',id);if(error)throw new Error(Q(error.message))},
async setMute(id,until){const{error}=await sb.from('profiles').update({muted_until:until}).eq('id',id);if(error)throw new Error(Q(error.message))},
async listProducts(){const{data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});if(error)throw new Error(Q(error.message));
 return(data||[]).map(p=>({...p,id:String(p.id)}))},
async createProduct(p){const{error}=await sb.from('products').insert({title:p.title,category:p.category,description:p.description,cover_url:p.cover_url,link_url:p.link_url,script_url:p.script_url,author_id:p.author_id,author_name:p.author_name});if(error)throw new Error(Q(error.message))},
async deleteProduct(id){const{error}=await sb.from('products').delete().eq('id',id);if(error)throw new Error(Q(error.message))},
async upload(file){const ext=(file.name.split('.').pop()||'bin').toLowerCase().slice(0,5);const path=S.user.id+'/'+Date.now()+'_'+uid()+'.'+ext;
 const{error}=await sb.storage.from('media').upload(path,file,{cacheControl:'3600',upsert:false});if(error)throw new Error('上传失败：'+error.message);
 const{data}=sb.storage.from('media').getPublicUrl(path);return data.publicUrl}
};

const S={user:null,page:'feed',tab:'login',posts:[],profiles:{},products:[],users:[],compose:null,prodForm:null,view:null,comments:[],adminQ:'',prodCat:'全部',pending:0};
const TITLES={'7891king':[{t:'♛ 站主',s:'owner'},{t:'管理员',s:'admin'},{t:'作者',s:'author'},{t:'SSSVIP',s:'svip'}],'骆真权':[{t:'管理员',s:'admin'}],'8045':[{t:'老乐',s:'admin'}],'带土':[{t:'农村人',s:'admin'}],'丁涛':[{t:'玻璃纤维',s:'admin'}],'谭力玮':[{t:'管理员',s:'admin'}],'xujingfeng00':[{t:'实名制上网第一人',s:'svip'}]};
const rankOf=n=>!n?1:CFG.AUTHOR_NAMES.indexOf(n)>-1?3:CFG.ADMIN_NAMES.indexOf(n)>-1?2:1;
const myRank=()=>{if(!S.user)return 0;let r=rankOf(S.user.username);if(S.user.role==='admin')r=Math.max(r,2);if(S.user.role==='author')r=Math.max(r,3);if(S.user.status==='banned'||S.user.status==='deleted')return 0;return r};
const isAdmin=()=>myRank()>=2;
const isMuted=()=>!!(S.user&&S.user.muted_until&&new Date(S.user.muted_until)>new Date());
const avatarOf=id=>(S.profiles[id]&&S.profiles[id].avatar)||'';
function avaHTML(n,u,c){const h=hue(n);return u?'<div class="ava '+(c||'')+'" style="--h:'+h+'"><img src="'+esc(u)+'"></div>':'<div class="ava '+(c||'')+'" style="--h:'+h+'">'+esc(String(n||'?').slice(0,1))+'</div>'}
function badgesHTML(n,lim){let l=TITLES[n];if(!l)l=CFG.ADMIN_NAMES.indexOf(n)>-1?[{t:'管理员',s:'admin'}]:[];const u=lim?l.slice(0,lim):l;return u.map(b=>'<i class="bd bd-'+b.s+'">'+esc(b.t)+'</i>').join('')}

function authHTML(){const lo=S.tab==='login';
return `<div class="auth"><div class="auth-card glass">
<div class="brand"><h1>${esc(CFG.SITE)}</h1><p>HAIDONG · INTRANET</p></div>
<div class="tabs"><div class="tab ${lo?'on':''}" data-act="tab" data-id="login">登录</div><div class="tab ${lo?'':'on'}" data-act="tab" data-id="register">注册</div></div>
<form data-form="${lo?'login':'register'}">
<div class="field"><label>用户名</label><input name="username" placeholder="你的名字" maxlength="16" required></div>
<div class="field"><label>密码</label><input name="password" type="password" placeholder="至少 6 位" minlength="6" required></div>
${lo?'':'<div class="field"><label>邀请码（选填）</label><input name="invite" placeholder="有邀请码可免审核" maxlength="20"></div>'}
<button class="btn primary" style="width:100%;margin-top:6px;padding:13px" type="submit">${lo?'进入海东内网':'提交注册申请'}</button>
</form>
<div class="hint">${lo?'没有账号？点上面的「注册」':'不填邀请码也可以，提交后等管理员审核'}<br>登录后点头像可换头像</div>
</div></div>`}

function gateHTML(){const st=S.user.status;let ic='⏳',ti='申请已提交，等待审核',de='管理员通过后就能进站，可以过一会儿点刷新看看。';
if(st==='banned'){ic='🚫';ti='账号已被封禁';de='如有疑问请联系站长或管理员。'}
if(st==='rejected'){ic='❌';ti='注册申请未通过';de='可以联系管理员说明情况，或换个用户名重新注册。'}
if(st==='deleted'){ic='🗑️';ti='账号已注销';de='该账号已被管理员删除，如需恢复请联系站长。'}
return `<div class="auth"><div class="auth-card glass" style="text-align:center">
<div style="font-size:44px">${ic}</div>
<h2 style="margin:12px 0 8px;font-size:19px;font-weight:900">${ti}</h2>
<p style="margin:0 0 6px;color:var(--dim);font-size:13.5px;line-height:1.8">${de}</p>
<p style="margin:0 0 16px;color:var(--dim);font-size:12px">当前账号：<b>${esc(S.user.username)}</b></p>
<button class="btn primary" style="width:100%;margin-bottom:9px" data-act="refresh">刷新状态</button>
<button class="btn" style="width:100%" data-act="logout">退出登录</button>
</div></div>`}

function navHTML(){const p=S.page;
return `<nav class="tabbar glass">
<button class="tnav ${p==='feed'?'on':''}" data-act="go" data-id="feed"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.6V20h13V9.6"/></svg>首页</button>
<button class="tnav ${p==='products'?'on':''}" data-act="go" data-id="products"><svg viewBox="0 0 24 24"><path d="M4 7.5h16V20H4z"/><path d="M9 7.5V4.5h6v3"/></svg>产品</button>
<button class="tplus" data-act="compose"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14"/></svg></button>
${myRank()>=2?`<button class="tnav ${p==='admin'?'on':''}" data-act="go" data-id="admin">${S.pending>0?`<i class="dot">${S.pending>99?'99+':S.pending}</i>`:''}<svg viewBox="0 0 24 24"><path d="M12 3.5l7 3.8v4.9c0 3.9-2.9 6.9-7 8.8-4.1-1.9-7-4.9-7-8.8V7.3z"/></svg>管理</button>`:''}
<button class="tnav ${p==='me'?'on':''}" data-act="go" data-id="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M4.6 20c1.2-3.6 4-5.4 7.4-5.4S18.2 16.4 19.4 20"/></svg>我的</button>
</nav>`}
</script>

<!-- ===== 第 3 段开始 ===== -->
<script>
function postHTML(p,i){const liked=(p.likes||[]).indexOf(S.user.id)>-1,can=myRank()>=2||p.author_id===S.user.id;
let m='';if(p.media_url)m=p.media_type==='video'?`<div class="pmedia"><video src="${esc(p.media_url)}" controls playsinline></video></div>`:`<div class="pmedia"><img src="${esc(p.media_url)}" loading="lazy"></div>`;
return `<article class="post" style="animation-delay:${Math.min(i*.04,.3)}s">${avaHTML(p.author_name,avatarOf(p.author_id))}
<div class="pc"><div class="prow"><b>${esc(p.author_name)}${badgesHTML(p.author_name)}</b><time>· ${ago(p.created_at)}</time>${p.pinned?'<span class="bd bd-owner" style="margin-left:auto">置顶</span>':''}</div>
${p.title?`<div class="ptitle">${nl(p.title)}</div>`:''}${p.body?`<div class="ptext">${nl(p.body)}</div>`:''}${m}
<div class="pacts"><button class="act ${liked?'on':''}" data-act="like" data-id="${p.id}"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9.2A4.1 4.1 0 0 1 12 7a4.1 4.1 0 0 1 7 3.8C19 15.6 12 20 12 20z"/></svg>${p.likes.length||''}</button>
<button class="act" data-act="open" data-id="${p.id}"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H8l-4 3v-6.6A8 8 0 0 1 13 4a8 8 0 0 1 8 8z"/></svg>${p.comment_count||''}</button>
<div class="spacer"></div>${isAdmin()?`<button class="act" data-act="pin" data-id="${p.id}">${p.pinned?'取消置顶':'置顶'}</button>`:''}${can?`<button class="act" data-act="edit" data-id="${p.id}">编辑</button><button class="act" data-act="del" data-id="${p.id}">删除</button>`:''}</div></div></article>`}

const feedHTML=()=>S.posts.length?S.posts.map(postHTML).join(''):'<div class="empty glass" style="border-radius:18px">还没有内容，点中间的 ＋ 发第一条</div>';

const prodCard=p=>`<div class="pcard" data-act="openProd" data-url="${esc(p.link_url||'')}"><div class="pcover" style="background-image:url('${esc(p.cover_url||'')}')"><b>${esc(p.category||'资源')}</b></div><div class="pbody"><b>${esc(p.title)}</b><span>${esc(p.author_name||'')} · ${ago(p.created_at)}</span>${(p.author_id===S.user.id||myRank()>=2)?`<button class="act" style="margin-left:-8px;font-size:11.5px" data-act="prodDel" data-id="${p.id}">删除</button>`:''}</div></div>`;

function productsHTML(){const cats=['全部'].concat(CATS);const list=S.products.filter(x=>S.prodCat==='全部'||x.category===S.prodCat);
return `<div class="row" style="margin:4px 0 10px"><div style="font-size:16px;font-weight:900">我们的产品</div><div class="spacer"></div><button class="btn mini primary" data-act="prodNew">＋ 发布</button></div>
<div class="chips">${cats.map(c=>`<button class="cchip ${S.prodCat===c?'on':''}" data-act="pcat" data-id="${c}">${c}</button>`).join('')}</div>
${list.length?`<div class="grid">${list.map(prodCard).join('')}</div>`:'<div class="empty glass" style="border-radius:18px">这个分区还没有产品</div>'}`}

function userRow(u){const r=rankOf(u.username),st=u.status||'approved',mu=!!(u.muted_until&&new Date(u.muted_until)>new Date()),can=myRank()>r&&u.id!==S.user.id;
const lb=st==='approved'?'已通过':st==='pending'?'待审核':st==='banned'?'已封禁':st==='deleted'?'已注销':'已拒绝';
let acts=`<span style="font-size:11px;color:var(--dim)">${u.id===S.user.id?'这是你自己':'权限不足'}</span>`;
if(can){const b=[];
if(st!=='approved'&&st!=='deleted')b.push(`<button class="btn mini primary" data-act="uok" data-id="${u.id}">通过</button>`);
if(st==='pending')b.push(`<button class="btn mini danger" data-act="uno" data-id="${u.id}">拒绝</button>`);
if(st==='approved')b.push(`<button class="btn mini danger" data-act="uban" data-id="${u.id}">封禁</button>`);
if(st==='approved')b.push(mu?`<button class="btn mini" data-act="uunmute" data-id="${u.id}">解除禁言</button>`:`<button class="btn mini" data-act="umute" data-id="${u.id}">禁言 7 天</button>`);
if(st==='deleted')b.push(`<button class="btn mini primary" data-act="uok" data-id="${u.id}">恢复账号</button>`);
else b.push(`<button class="btn mini danger" data-act="udel" data-id="${u.id}">删除账号</button>`);
acts=b.join('')}
const inv=u.invite_code?`<b style="color:var(--txt)">${esc(u.invite_code)}</b>${CFG.INVITES.indexOf(u.invite_code)>-1?' <span style="color:#0f8a4d;font-weight:800">✓ 有效</span>':' <span style="color:#b57400;font-weight:800">⚠ 未登记</span>'}`:'<span style="color:#b57400;font-weight:800">未填写</span>';
return `<div class="urow" style="${st==='deleted'?'opacity:.5':''}">${avaHTML(u.username,u.avatar,'sm')}
<div class="uinfo"><b>${esc(u.username)}${r===3?'<span class="ustat s-author">作者</span>':''}<span class="ustat s-${st}">${lb}</span>${mu?'<span class="ustat s-pending">禁言中</span>':''}</b>
<div>注册：${fmt(u.created_at)}</div><div>邀请码：${inv}</div><div class="uacts">${acts}</div></div></div>`}

function userListHTML(){const q=S.adminQ.trim().toLowerCase();const l=S.users.filter(u=>!q||String(u.username||'').toLowerCase().indexOf(q)>-1);
l.sort((a,b)=>{const pa=(a.status||'approved')==='pending'?0:1,pb=(b.status||'approved')==='pending'?0:1;if(pa!==pb)return pa-pb;return String(b.created_at||'').localeCompare(String(a.created_at||''))});
return l.length?l.map(userRow).join(''):'<div class="empty" style="padding:26px;font-size:13px">没有匹配的账号</div>'}

function adminHTML(){return `<div class="row" style="margin:4px 0 10px"><div style="font-size:16px;font-weight:900">管理后台</div><div class="spacer"></div><span style="font-size:12px;color:var(--dim)">共 ${S.users.length} 个 · 待审核 ${S.users.filter(u=>(u.status||'approved')==='pending').length}</span></div>
<input data-role="adminq" placeholder="搜索用户名…" value="${esc(S.adminQ)}" style="margin-bottom:12px">
<div id="ulist">${userListHTML()}</div>`}

function meHTML(){const u=S.user,r=myRank();
return `<div class="glass" style="border-radius:20px;padding:18px;text-align:center;margin-bottom:12px">
<label style="display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer"><div style="padding:3px;border-radius:50%;background:linear-gradient(135deg,#1d9bf0,#7856ff)">${avaHTML(u.username,u.avatar,'xl')}</div><small style="color:var(--dim);font-size:12px">点击更换头像</small><input type="file" accept="image/*" data-role="avatar" hidden></label>
<div style="font-size:18px;font-weight:900;margin-top:4px">${esc(u.username)}</div>
<div style="margin-top:7px">${badgesHTML(u.username)||'<span style="color:var(--dim);font-size:12px">暂无头衔</span>'}</div>
<div style="font-size:11.5px;color:var(--dim);margin-top:9px">注册于 ${fmt(u.created_at)}${isMuted()?' · 已被禁言':''}</div></div>
<div class="glass" style="border-radius:18px;padding:14px">
<div class="field"><label>身份</label><input value="${r===3?'作者（最高权限）':r===2?'管理员':'成员'}" disabled></div>
<div class="field"><label>账号状态</label><input value="${u.status==='approved'?'已通过审核':u.status}" disabled></div>
<button class="btn danger" style="width:100%" data-act="logout">退出登录</button></div>`}

function composerHTML(){const ed=S.compose.id?S.posts.find(p=>p.id===S.compose.id):null,d=ed||{title:'',body:'',media_type:'none',media_url:''};
const su=d.media_type!=='none'&&d.media_url&&d.media_url.indexOf('data:')!==0;
return `<div class="mask" data-act="close-modal"><div class="sheet glass" data-stop="1"><h2>${ed?'编辑内容':'发布新内容'}</h2>
<form data-form="post">
<div class="field"><label>标题（可留空）</label><input name="title" value="${esc(d.title||'')}" maxlength="60"></div>
<div class="field"><label>正文</label><textarea name="body" rows="5">${esc(d.body||'')}</textarea></div>
<div class="field"><label>图片 / 视频（不选 = 保留原媒体）</label><input type="file" name="file" accept="image/*,video/*"></div>
<div class="field"><label>或粘贴媒体链接</label><input name="media_url" value="${esc(su?d.media_url:'')}" placeholder="https://…"></div>
${isAdmin()?`<div class="field"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="pinned" style="width:16px;height:16px" ${d.pinned?'checked':''}> 置顶这条</label></div>`:''}
<div class="row" style="margin-top:14px"><button class="btn primary" type="submit" style="flex:1">${ed?'保存修改':'发布'}</button><button class="btn" type="button" data-act="close-modal">取消</button></div>
</form></div></div>`}

function viewHTML(){const p=S.posts.find(x=>x.id===S.view);if(!p)return'';
const liked=(p.likes||[]).indexOf(S.user.id)>-1;let m='';
if(p.media_url)m=p.media_type==='video'?`<div class="pmedia"><video src="${esc(p.media_url)}" controls playsinline></video></div>`:`<div class="pmedia"><img src="${esc(p.media_url)}"></div>`;
const cs=S.comments.map(c=>`<div class="cmt">${avaHTML(c.author_name,avatarOf(c.author_id),'sm')}<div class="cb"><b>${esc(c.author_name)}${badgesHTML(c.author_name)}</b> <time>${ago(c.created_at)}</time><p>${nl(c.body)}</p></div>${(c.author_id===S.user.id||myRank()>=2)?`<button class="btn mini ghost" data-act="del-cmt" data-id="${c.id}">删</button>`:''}</div>`).join('');
return `<div class="mask" data-act="close-modal"><div class="sheet glass" data-stop="1">
<div style="display:flex;align-items:center;gap:9px;margin-bottom:12px">${avaHTML(p.author_name,avatarOf(p.author_id),'lg')}<div style="flex:1;min-width:0"><b style="font-size:15px">${esc(p.author_name)}${badgesHTML(p.author_name)}</b><div style="font-size:11.5px;color:var(--dim)">${ago(p.created_at)}</div></div><button class="btn mini" data-act="close-modal">关闭</button></div>
${p.title?`<div class="ptitle" style="font-size:18px">${nl(p.title)}</div>`:''}${p.body?`<div class="ptext">${nl(p.body)}</div>`:''}${m}
<div class="pacts" style="margin-top:12px;border-top:1px solid rgba(18,28,45,.07);padding-top:10px"><button class="act ${liked?'on':''}" data-act="like" data-id="${p.id}"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9.2A4.1 4.1 0 0 1 12 7a4.1 4.1 0 0 1 7 3.8C19 15.6 12 20 12 20z"/></svg>${p.likes.length}</button><span class="act" style="cursor:default">${p.comment_count} 条评论</span></div>
<div style="margin-top:6px">${cs||'<div class="empty" style="padding:22px;font-size:13px">还没有评论</div>'}</div>
<form data-form="comment" data-id="${p.id}" style="margin-top:12px"><div class="row"><input name="body" placeholder="友善发言…" maxlength="300" required><button class="btn primary" type="submit">发送</button></div></form>
</div></div>`}

function prodFormHTML(){return `<div class="mask" data-act="close-modal"><div class="sheet glass" data-stop="1"><h2>发布产品</h2>
<form data-form="product">
<div class="field"><label>产品名称</label><input name="title" maxlength="40" required></div>
<div class="field"><label>分区</label><select name="category">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
<div class="field"><label>简介（选填）</label><textarea name="description" rows="3"></textarea></div>
<div class="field"><label>直链（点击跳转）</label><input name="link_url" placeholder="https://…" required></div>
<div class="field"><label>脚本链接（选填）</label><input name="script_url" placeholder="https://…"></div>
<div class="field"><label>封面（自动裁成 16:9）</label><input type="file" name="cover" accept="image/*"></div>
<div class="row" style="margin-top:14px"><button class="btn primary" type="submit" style="flex:1">发布</button><button class="btn" type="button" data-act="close-modal">取消</button></div>
</form></div></div>`}

function renderModal(){const m=$('#modal');
if(S.compose)m.innerHTML=composerHTML();else if(S.view)m.innerHTML=viewHTML();else if(S.prodForm)m.innerHTML=prodFormHTML();else m.innerHTML='';
document.body.classList.toggle('lock',!!(S.compose||S.view||S.prodForm))}

function render(){const a=$('#app');
if(!sb){a.innerHTML='<div style="padding:40px;color:#c0392b;font-size:14px">Supabase 库没加载成功，请刷新页面或换网络</div>';return}
if(!S.user){a.innerHTML=authHTML();renderModal();return}
if(S.user.status!=='approved'||myRank()===0){a.innerHTML=gateHTML();renderModal();return}
if(S.page==='admin'&&myRank()<2)S.page='feed';
const b=S.page==='products'?productsHTML():S.page==='admin'?adminHTML():S.page==='me'?meHTML():feedHTML();
a.innerHTML=`<header class="thead"><div class="tname">${esc(CFG.SITE)}</div><div class="spacer"></div><button data-act="go" data-id="me" style="border:none;background:none;padding:0;cursor:pointer">${avaHTML(S.user.username,S.user.avatar,'sm')}</button></header>
<main class="wrap2">${isMuted()?'<div class="notice">你正在被禁言，暂时不能发帖和评论。</div>':''}${b}</main>${navHTML()}`;
renderModal()}

function paintDot(){document.querySelectorAll('.tnav[data-id="admin"]').forEach(b=>{let d=b.querySelector('.dot');
if(S.pending>0){if(!d){d=document.createElement('i');d.className='dot';b.insertBefore(d,b.firstChild)}d.textContent=S.pending>99?'99+':S.pending}
else if(d)d.remove()})}
async function refreshPending(){if(!S.user||myRank()<2){S.pending=0;paintDot();return}try{S.pending=await api.countPending()}catch(e){}paintDot()}

async function loadPosts(){try{S.posts=await api.listPosts()}catch(e){toast(e.message);S.posts=[]}
try{const l=await api.listProfiles();S.profiles={};l.forEach(p=>S.profiles[p.id]=p)}catch(e){}}
async function loadProducts(){try{S.products=await api.listProducts()}catch(e){S.products=[]}}
async function openPost(id){S.view=id;renderModal();try{S.comments=await api.listComments(id)}catch(e){S.comments=[]}renderModal()}

document.addEventListener('click',async ev=>{
const t=ev.target.closest('[data-act]');if(!t)return;
const act=t.dataset.act,id=t.dataset.id;
if(t.classList.contains('mask')&&ev.target.closest('[data-stop]'))return;
if(act==='tab'){S.tab=id;render();return}
if(act==='logout'){await api.signOut();S.user=null;S.posts=[];S.products=[];S.users=[];S.profiles={};S.view=null;S.compose=null;S.prodForm=null;S.page='feed';render();return}
if(act==='refresh'){try{const m=await api.me();if(m){S.user=m;if(m.status==='approved'){await loadPosts();await loadProducts();if(myRank()>=2)S.pending=await api.countPending()}}render();toast('已刷新')}catch(e){toast(e.message)}return}
if(act==='go'){S.page=id;if(id==='admin'&&myRank()>=2){try{S.users=await api.listUsers();S.pending=S.users.filter(u=>(u.status||'approved')==='pending').length}catch(e){toast(e.message)}}render();window.scrollTo(0,0);return}
if(act==='compose'){if(isMuted())return toast('正在禁言中，不能发帖');S.compose={id:null};renderModal();return}
if(act==='edit'){S.compose={id};renderModal();return}
if(act==='close-modal'){S.compose=null;S.view=null;S.prodForm=null;renderModal();return}
if(act==='prodNew'){S.prodForm=true;renderModal();return}
if(act==='pcat'){S.prodCat=id;render();return}
if(act==='openProd'){const u=t.dataset.url;if(!u)return toast('这个产品没填链接');window.open(u,'_blank');return}
if(act==='prodDel'){if(!confirm('确定删除这个产品吗？'))return;try{await api.deleteProduct(id);await loadProducts();render();toast('已删除')}catch(e){toast(e.message)}return}
if(act==='like'){const p=S.posts.find(x=>x.id===id);if(!p)return;const i=p.likes.indexOf(S.user.id);i>-1?p.likes.splice(i,1):p.likes.push(S.user.id);render();
try{await api.toggleLike(id,S.user.id)}catch(e){toast('点赞失败：'+e.message);await loadPosts();render()}return}
if(act==='open'){openPost(id);return}
if(act==='pin'){if(!isAdmin())return;const p=S.posts.find(x=>x.id===id);
try{await api.updatePost(id,{pinned:!p.pinned});await loadPosts();render()}catch(e){toast('置顶失败')}return}
if(act==='del'){if(!confirm('确定删除这条内容吗？'))return;
try{await api.deletePost(id);S.view=null;await loadPosts();render();toast('已删除')}catch(e){toast('删除失败：'+e.message)}return}
if(act==='del-cmt'){try{await api.deleteComment(id);S.comments=await api.listComments(S.view);await loadPosts();renderModal()}catch(e){toast('删除失败')}return}
if(['uok','uno','uban','umute','uunmute','udel'].indexOf(act)>-1){
 const u=S.users.find(x=>x.id===id);if(!u)return;
 if(myRank()<=rankOf(u.username))return toast('权限不足：管不了同级或更高等级的人');
 try{
  if(act==='uok')await api.setStatus(id,'approved');
  if(act==='uno')await api.setStatus(id,'rejected');
  if(act==='uban')await api.setStatus(id,'banned');
  if(act==='umute')await api.setMute(id,new Date(Date.now()+7*864e5).toISOString());
  if(act==='uunmute')await api.setMute(id,null);
  if(act==='udel'){if(!confirm('确定删除「'+u.username+'」的账号吗？删除后他会被立刻踢出网站。'))return;
   if(!confirm('再确认一次：真的要删除吗？'))return;await api.setStatus(id,'deleted');await api.setMute(id,null)}
  S.users=await api.listUsers();S.pending=S.users.filter(z=>(z.status||'approved')==='pending').length;
  const bx=$('#ulist');if(bx)bx.innerHTML=userListHTML();paintDot();toast('已更新')
 }catch(e){toast(e.message)}
 return}
});

document.addEventListener('input',ev=>{if(!ev.target.dataset||ev.target.dataset.role!=='adminq')return;
S.adminQ=ev.target.value;const b=$('#ulist');if(b)b.innerHTML=userListHTML()});

document.addEventListener('change',async ev=>{const i=ev.target;
if(!i.dataset||i.dataset.role!=='avatar')return;
const f=i.files&&i.files[0];i.value='';if(!f)return;
if(f.type.indexOf('image/')!==0)return toast('请选一张图片');
toast('正在上传…');
try{const bl=await shrink(f);const url=await api.saveAvatar(bl);
S.user.avatar=url;S.profiles[S.user.id]={id:S.user.id,username:S.user.username,avatar:url};
await loadPosts();render();toast('头像已更新 ✨')}catch(e){toast(e.message||'上传失败')}});

document.addEventListener('submit',async ev=>{const f=ev.target;
if(!f.matches('form[data-form]'))return;ev.preventDefault();
const k=f.dataset.form,btn=f.querySelector('button[type=submit]'),old=btn?btn.textContent:'';
const busy=()=>{if(btn){btn.disabled=true;btn.textContent='处理中…'}};
const done=()=>{if(btn){btn.disabled=false;btn.textContent=old}};
if(k==='login'||k==='register'){
 const u=f.username.value.trim(),p=f.password.value,inv=f.invite?f.invite.value.trim():'';
 if(u.length<2)return toast('用户名至少 2 个字');
 if(p.length<6)return toast('密码至少 6 位');
 busy();
 try{if(k==='register')await api.signUp(u,p,inv);else await api.signIn(u,p);
  S.user=await api.me();if(!S.user)throw new Error('登录状态异常');
  if(S.user.status==='approved'){await loadPosts();await loadProducts();if(myRank()>=2)S.pending=await api.countPending()}
  S.page='feed';render()}catch(e){toast(e.message)}
 done();return}
if(k==='post'){
 if(isMuted()){done();return toast('正在禁言中，不能发帖')}
 busy();
 try{
  let mu=(f.media_url.value||'').trim(),mt=mu?(/\.(mp4|webm|mov|m4v)(\?|$)/i.test(mu)?'video':'image'):'none';
  const file=f.file.files&&f.file.files[0];
  if(file){mu=await api.upload(file);mt=file.type.indexOf('video')===0?'video':'image'}
  const pl={author_id:S.user.id,author_name:S.user.username,title:f.title.value.trim(),body:f.body.value.trim(),media_type:mt,media_url:mu,pinned:!!(f.pinned&&f.pinned.checked)};
  const ed=!!S.compose.id;
  if(!ed&&!pl.title&&!pl.body&&!pl.media_url){done();return toast('写点内容再发吧')}
  if(ed){delete pl.author_id;delete pl.author_name;await api.updatePost(S.compose.id,pl)}else await api.createPost(pl);
  S.compose=null;await loadPosts();render();toast('搞定 ✨')
 }catch(e){toast(e.message)}
 done();return}
if(k==='comment'){
 if(isMuted()){done();return toast('正在禁言中，不能评论')}
 const b=f.body.value.trim();if(!b)return;
 busy();
 try{await api.addComment({post_id:f.dataset.id,author_id:S.user.id,author_name:S.user.username,body:b});
  S.comments=await api.listComments(f.dataset.id);await loadPosts();renderModal()}catch(e){toast(e.message)}
 done();return}
if(k==='product'){
 busy();
 try{
  const title=f.title.value.trim(),link=f.link_url.value.trim();
  if(!title){done();return toast('产品名称不能空')}
  if(!link){done();return toast('直链不能空')}
  let cover='';const cf=f.cover.files&&f.cover.files[0];
  if(cf){const bl=await cropCover(cf);cover=await api.upload(new File([bl],'cover.jpg',{type:'image/jpeg'}))}
  await api.createProduct({title,category:f.category.value,description:f.description.value.trim(),cover_url:cover,link_url:link,script_url:f.script_url.value.trim(),author_id:S.user.id,author_name:S.user.username});
  S.prodForm=null;await loadProducts();render();toast('产品已发布 🚀')
 }catch(e){toast(e.message)}
 done()}
});

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.compose||S.view||S.prodForm)){S.compose=null;S.view=null;S.prodForm=null;renderModal()}});

(async function boot(){
 render();
 try{const m=await api.me();
  if(m){S.user=m;
   if(m.status==='approved'){await loadPosts();await loadProducts();if(myRank()>=2)S.pending=await api.countPending()}}
 }catch(e){}
 render();
 setInterval(()=>{if(S.user&&myRank()>=2)refreshPending()},60000);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
